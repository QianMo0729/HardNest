<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><style>.nav-link{position:relative;}.nav-link::after{content:'';position:absolute;left:0;right:0;bottom:-7px;height:1.5px;background:#FF8438;transform:scaleX(0);transition:transform 0.4s cubic-bezier(.16,1,.3,1);}.nav-link:hover::after{transform:scaleX(1);}</style></helmet>
<div style="{{ navBarStyle }}">
  <div style="width:100%;max-width:1360px;margin:0 auto;padding:0 28px;display:flex;align-items:center;justify-content:space-between;box-sizing:border-box;height:100%;">
    <a href="Home.dc.html" style="display:flex;align-items:center;height:26px;flex-shrink:0;">
      <img src="assets/logo-mark-dark.png" alt="Hardnest" style="height:26px;width:auto;display:block;" />
    </a>
    <sc-if value="{{ showDesktopNav }}" hint-placeholder-val="{{ true }}">
      <div style="display:flex;align-items:center;gap:40px;position:absolute;left:50%;transform:translateX(-50%);">
        <a href="Home.dc.html" class="nav-link" style="{{ styleHome }}">首页</a>
        <a href="Products.dc.html" class="nav-link" style="{{ styleProducts }}">产品</a>
        <a href="BrandStory.dc.html" class="nav-link" style="{{ styleStory }}">品牌故事</a>
        <a href="Contact.dc.html" class="nav-link" style="{{ styleContact }}">联系我们</a>
      </div>
    </sc-if>
    <div style="display:flex;align-items:center;gap:18px;flex-shrink:0;">
      <sc-if value="{{ showDesktopNav }}" hint-placeholder-val="{{ true }}">
        <a href="Contact.dc.html" style="background:#FF6714;color:#0A0908;padding:10px 22px;border-radius:999px;font-size:13.5px;font-weight:700;text-decoration:none;letter-spacing:0.02em;box-shadow:0 6px 20px rgba(255,103,20,0.24);transition:transform 0.35s cubic-bezier(.16,1,.3,1),background 0.3s ease;display:inline-block;" style-hover="background:#FF8438;transform:scale(1.05);">咨询加盟</a>
      </sc-if>
      <sc-if value="{{ showMobileToggle }}" hint-placeholder-val="{{ false }}">
        <button onClick="{{ toggleMobile }}" aria-label="菜单" style="width:38px;height:38px;border-radius:50%;border:1px solid rgba(245,244,242,0.2);background:transparent;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;">
          <div style="width:15px;height:10px;position:relative;">
            <span style="position:absolute;top:0;left:0;right:0;height:1.5px;background:#F5F4F2;"></span>
            <span style="position:absolute;bottom:0;left:0;right:0;height:1.5px;background:#F5F4F2;"></span>
          </div>
        </button>
      </sc-if>
    </div>
  </div>
</div>
<sc-if value="{{ mobileOpen }}" hint-placeholder-val="{{ false }}">
  <div style="position:fixed;inset:0;z-index:1100;background:#0A0908;display:flex;flex-direction:column;animation:navFadeIn 0.35s ease;">
    <div style="display:flex;align-items:center;justify-content:space-between;padding:20px 28px;height:74px;box-sizing:border-box;">
      <img src="assets/logo-mark-dark.png" alt="Hardnest" style="height:24px;width:auto;display:block;" />
      <button onClick="{{ closeMobile }}" aria-label="关闭" style="width:38px;height:38px;border-radius:50%;border:1px solid rgba(245,244,242,0.2);background:transparent;color:#F5F4F2;font-size:18px;cursor:pointer;padding:0;">✕</button>
    </div>
    <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:36px;">
      <a href="Home.dc.html" onClick="{{ closeMobile }}" style="color:#F5F4F2;font-size:30px;font-weight:600;text-decoration:none;letter-spacing:-0.01em;">首页</a>
      <a href="Products.dc.html" onClick="{{ closeMobile }}" style="color:#F5F4F2;font-size:30px;font-weight:600;text-decoration:none;letter-spacing:-0.01em;">产品</a>
      <a href="BrandStory.dc.html" onClick="{{ closeMobile }}" style="color:#F5F4F2;font-size:30px;font-weight:600;text-decoration:none;letter-spacing:-0.01em;">品牌故事</a>
      <a href="Contact.dc.html" onClick="{{ closeMobile }}" style="background:#FF6714;color:#0A0908;padding:15px 32px;border-radius:999px;font-size:18px;font-weight:700;text-decoration:none;margin-top:8px;">咨询加盟</a>
    </div>
  </div>
</sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;: {&quot;width&quot;: &quot;100%&quot;, &quot;height&quot;: 100}, &quot;active&quot;: {&quot;editor&quot;: &quot;enum&quot;, &quot;default&quot;: &quot;home&quot;, &quot;options&quot;: [&quot;home&quot;, &quot;products&quot;, &quot;story&quot;, &quot;contact&quot;], &quot;tsType&quot;: &quot;string&quot;}}">
class Component extends DCLogic {
  state = { hidden: false, scrolled: false, mobileOpen: false, isNarrow: false };

  componentDidMount() {
    this._lastY = window.scrollY || 0;
    this._ticking = false;
    this._onScroll = () => {
      if (this._ticking) return;
      this._ticking = true;
      requestAnimationFrame(() => {
        const y = window.scrollY || 0;
        const scrolled = y > 40;
        let hidden = this.state.hidden;
        if (y < 80) hidden = false;
        else if (y > this._lastY + 4) hidden = true;
        else if (y < this._lastY - 4) hidden = false;
        if (hidden !== this.state.hidden || scrolled !== this.state.scrolled) {
          this.setState({ hidden, scrolled });
        }
        this._lastY = y;
        this._ticking = false;
      });
    };
    window.addEventListener('scroll', this._onScroll, { passive: true });
    this._mq = window.matchMedia('(max-width: 860px)');
    this._onMq = () => this.setState({ isNarrow: this._mq.matches });
    this._onMq();
    this._mq.addEventListener('change', this._onMq);
  }

  componentWillUnmount() {
    window.removeEventListener('scroll', this._onScroll);
    if (this._mq) this._mq.removeEventListener('change', this._onMq);
  }

  toggleMobile = () => this.setState(s => ({ mobileOpen: !s.mobileOpen }));
  closeMobile = () => this.setState({ mobileOpen: false });

  linkStyle(key) {
    const active = (this.props.active || 'home') === key;
    return `color:${active ? '#F5F4F2' : 'rgba(245,244,242,0.56)'};font-weight:${active ? 600 : 500};text-decoration:none;font-size:14.5px;letter-spacing:0.01em;transition:color 0.3s ease;`;
  }

  renderVals() {
    const scrolled = this.state.scrolled;
    return {
      navBarStyle: `position:fixed;top:0;left:0;right:0;z-index:1000;height:74px;display:flex;align-items:center;background:${scrolled ? 'rgba(9,8,7,0.74)' : 'rgba(9,8,7,0.26)'};backdrop-filter:blur(${scrolled ? 20 : 8}px) saturate(160%);-webkit-backdrop-filter:blur(${scrolled ? 20 : 8}px) saturate(160%);border-bottom:1px solid rgba(245,244,242,${scrolled ? 0.1 : 0.03});transform:translateY(${this.state.hidden ? '-100%' : '0'});transition:transform 0.5s cubic-bezier(.16,1,.3,1),background 0.4s ease,backdrop-filter 0.4s ease,border-color 0.4s ease;`,
      showDesktopNav: !this.state.isNarrow,
      showMobileToggle: this.state.isNarrow,
      mobileOpen: this.state.mobileOpen,
      toggleMobile: this.toggleMobile,
      closeMobile: this.closeMobile,
      styleHome: this.linkStyle('home'),
      styleProducts: this.linkStyle('products'),
      styleStory: this.linkStyle('story'),
      styleContact: this.linkStyle('contact')
    };
  }
}
</script>
</body>
</html>
