<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&family=Noto+Serif+SC:wght@500;700;900&display=swap" rel="stylesheet" />
<style>
*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{margin:0;background:#FBFAF8;font-family:'Noto Sans SC',-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif;-webkit-font-smoothing:antialiased;}
::-webkit-scrollbar{width:10px;}
::-webkit-scrollbar-track{background:#F1EEE7;}
::-webkit-scrollbar-thumb{background:rgba(20,19,18,0.22);border-radius:99px;border:2.5px solid #F1EEE7;}
::-webkit-scrollbar-thumb:hover{background:rgba(255,103,20,0.55);}
::selection{background:#FF6714;color:#0A0908;}
h1,h2,h3,p{text-wrap:pretty;}
a{color:#FF6714;}
a:hover{color:#E8590F;}
input::placeholder,textarea::placeholder{color:rgba(20,19,18,0.35);}
input:focus,textarea:focus{border-color:#FF6714 !important;box-shadow:0 0 0 4px rgba(255,103,20,0.12);}
@keyframes heroIn{from{opacity:0;transform:translateY(24px);}to{opacity:1;transform:translateY(0);}}
</style>
</helmet>
<div style="position:relative;background:#FBFAF8;overflow-x:hidden;overflow-x:clip;font-family:'Noto Sans SC',-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif;">
  <dc-import name="SiteNav" active="contact" hint-size="100%,74px"></dc-import>

  <section style="background:#FBFAF8;padding:170px 24px 56px;text-align:center;">
    <div style="max-width:720px;margin:0 auto;">
      <div style="animation:heroIn 0.9s cubic-bezier(.16,1,.3,1) 0.05s both;color:#FF6714;font-size:12px;font-weight:500;letter-spacing:0.22em;margin-bottom:22px;">联系我们</div>
      <h1 style="animation:heroIn 1s cubic-bezier(.16,1,.3,1) 0.15s both;color:#141312;font-size:clamp(34px,5.6vw,62px);font-weight:900;letter-spacing:-0.035em;line-height:1.2;margin:0 0 22px;">开始一次对话。</h1>
      <p style="animation:heroIn 1s cubic-bezier(.16,1,.3,1) 0.28s both;color:#6B655F;font-size:17px;font-weight:300;line-height:1.85;margin:0;">无论你是想入手一件家具，还是希望成为我们的经销伙伴——写下来，我们会尽快回复。</p>
    </div>
  </section>

  <section style="background:#FBFAF8;padding:24px 24px 180px;">
    <div style="max-width:680px;margin:0 auto;">
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:44px;">
        <button onClick="{{ setIdentityCustomer }}" style="{{ cardCustomerStyle }}">
          <span style="display:block;font-size:14.5px;font-weight:700;margin-bottom:6px;">我是消费者</span>
          <span style="display:block;font-size:12px;opacity:0.65;line-height:1.4;">想了解或入手产品</span>
        </button>
        <button onClick="{{ setIdentityDealer }}" style="{{ cardDealerStyle }}">
          <span style="display:block;font-size:14.5px;font-weight:700;margin-bottom:6px;">我是经销商</span>
          <span style="display:block;font-size:12px;opacity:0.65;line-height:1.4;">想成为合作伙伴</span>
        </button>
        <button onClick="{{ setIdentityMedia }}" style="{{ cardMediaStyle }}">
          <span style="display:block;font-size:14.5px;font-weight:700;margin-bottom:6px;">我是媒体</span>
          <span style="display:block;font-size:12px;opacity:0.65;line-height:1.4;">想了解报道合作</span>
        </button>
      </div>

      <sc-if value="{{ submitted }}" hint-placeholder-val="{{ false }}">
        <div style="background:#F1EEE7;border-radius:24px;padding:64px 40px;text-align:center;">
          <div style="width:56px;height:56px;border-radius:50%;background:#FF6714;color:#FBFAF8;display:flex;align-items:center;justify-content:center;font-size:26px;margin:0 auto 24px;">✓</div>
          <h3 style="margin:0 0 12px;color:#141312;font-family:'Noto Serif SC',serif;font-size:23px;font-weight:700;">已收到，我们会尽快联系您。</h3>
          <p style="margin:0 0 28px;color:#6B655F;font-size:15px;">感谢你花时间告诉我们你的需求。</p>
          <button onClick="{{ resetForm }}" style="background:transparent;border:1px solid rgba(20,19,18,0.2);color:#141312;padding:12px 28px;border-radius:999px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;">返回表单</button>
        </div>
      </sc-if>
      <sc-if value="{{ notSubmitted }}" hint-placeholder-val="{{ true }}">
        <div style="display:flex;flex-direction:column;gap:20px;">
          <div style="display:flex;flex-direction:column;gap:8px;">
            <label style="color:#A39C93;font-size:12px;font-weight:500;letter-spacing:0.1em;">姓名</label>
            <input value="{{ name }}" onChange="{{ onNameChange }}" placeholder="你的称呼" style="border:1px solid rgba(20,19,18,0.14);background:#FFFFFF;border-radius:14px;padding:15px 17px;font-size:15px;font-weight:400;color:#141312;font-family:inherit;outline:none;transition:border-color 0.25s ease,box-shadow 0.25s ease;" />
          </div>
          <div style="display:flex;flex-direction:column;gap:8px;">
            <label style="color:#A39C93;font-size:12px;font-weight:500;letter-spacing:0.1em;">手机或邮箱</label>
            <input value="{{ contact }}" onChange="{{ onContactChange }}" placeholder="方便我们联系到你" style="border:1px solid rgba(20,19,18,0.14);background:#FFFFFF;border-radius:14px;padding:15px 17px;font-size:15px;font-weight:400;color:#141312;font-family:inherit;outline:none;transition:border-color 0.25s ease,box-shadow 0.25s ease;" />
          </div>
          <div style="display:flex;flex-direction:column;gap:8px;">
            <label style="color:#A39C93;font-size:12px;font-weight:500;letter-spacing:0.1em;">想告诉我们的</label>
            <textarea value="{{ message }}" onChange="{{ onMessageChange }}" placeholder="你的空间、你的宠物、你感兴趣的产品……" rows="5" style="border:1px solid rgba(20,19,18,0.14);background:#FFFFFF;border-radius:14px;padding:15px 17px;font-size:15px;font-weight:400;color:#141312;font-family:inherit;outline:none;transition:border-color 0.25s ease,box-shadow 0.25s ease;resize:vertical;"></textarea>
          </div>
          <button onClick="{{ onSubmit }}" disabled="{{ submitDisabled }}" style="{{ submitStyle }}">提交</button>
        </div>
      </sc-if>

      <div data-reveal style="opacity:0;transform:translateY(24px);transition:opacity 0.8s ease,transform 0.8s ease;margin-top:64px;padding-top:36px;border-top:1px solid rgba(20,19,18,0.08);display:flex;flex-wrap:wrap;gap:16px;justify-content:space-between;color:#6B655F;font-size:14px;">
        <span>邮箱：hello@hardnest.cn</span>
        <span>工作时间：周一至周五 9:00–18:00</span>
      </div>
    </div>
  </section>

  <dc-import name="SiteFooter" hint-size="100%,420px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{}">
class Component extends DCLogic {
  state = { identity: '个人用户', name: '', contact: '', message: '', submitted: false };

  componentDidMount() {
    const params = new URLSearchParams(window.location.search);
    const type = params.get('type');
    const product = params.get('product');
    const color = params.get('color');
    const identityMap = { customer: '个人用户', dealer: '经销商加盟', media: '媒体合作' };
    const productNames = { yan: '岩', xue: '穴', jie: '阶', wan: '湾' };
    const patch = {};
    if (type && identityMap[type]) patch.identity = identityMap[type];
    if (product && productNames[product]) {
      patch.message = `我对「${productNames[product]}」${color ? `（${color}）` : ''}感兴趣，想了解更多。`;
    }
    if (Object.keys(patch).length) this.setState(patch);

    this._observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.style.opacity = '1';
          entry.target.style.transform = 'translateY(0)';
          this._observer.unobserve(entry.target);
        }
      });
    }, { threshold: 0.1 });
    document.querySelectorAll('[data-reveal]').forEach(el => this._observer.observe(el));
  }

  componentWillUnmount() {
    if (this._observer) this._observer.disconnect();
  }

  setIdentity(val) { this.setState({ identity: val }); }
  onNameChange = (e) => this.setState({ name: e.target.value });
  onContactChange = (e) => this.setState({ contact: e.target.value });
  onMessageChange = (e) => this.setState({ message: e.target.value });
  onSubmit = () => {
    if (!this.state.name.trim() || !this.state.contact.trim()) return;
    this.setState({ submitted: true });
  };
  resetForm = () => this.setState({ submitted: false, name: '', contact: '', message: '' });

  cardStyle(active) {
    return `padding:20px 16px;border-radius:16px;border:1.5px solid ${active ? '#141312' : 'rgba(20,19,18,0.12)'};background:${active ? '#141312' : '#FFFFFF'};color:${active ? '#F5F4F2' : '#141312'};text-align:left;cursor:pointer;transition:all 0.3s ease;font-family:inherit;`;
  }

  renderVals() {
    const canSubmit = this.state.name.trim().length > 0 && this.state.contact.trim().length > 0;
    return {
      name: this.state.name,
      contact: this.state.contact,
      message: this.state.message,
      submitted: this.state.submitted,
      notSubmitted: !this.state.submitted,
      setIdentityCustomer: () => this.setIdentity('个人用户'),
      setIdentityDealer: () => this.setIdentity('经销商加盟'),
      setIdentityMedia: () => this.setIdentity('媒体合作'),
      cardCustomerStyle: this.cardStyle(this.state.identity === '个人用户'),
      cardDealerStyle: this.cardStyle(this.state.identity === '经销商加盟'),
      cardMediaStyle: this.cardStyle(this.state.identity === '媒体合作'),
      onNameChange: this.onNameChange,
      onContactChange: this.onContactChange,
      onMessageChange: this.onMessageChange,
      onSubmit: this.onSubmit,
      resetForm: this.resetForm,
      submitDisabled: !canSubmit,
      submitStyle: `background:${canSubmit ? '#FF6714' : 'rgba(20,19,18,0.15)'};color:${canSubmit ? '#0A0908' : 'rgba(20,19,18,0.4)'};border:none;padding:16px;border-radius:12px;font-size:15.5px;font-weight:700;cursor:${canSubmit ? 'pointer' : 'not-allowed'};transition:background 0.3s ease;font-family:inherit;margin-top:8px;`
    };
  }
}
</script>
</body>
</html>
